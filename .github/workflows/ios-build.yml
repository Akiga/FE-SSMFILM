
name: SSM Film iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --include=optional

      - name: Build web app
        run: npm run build

      - name: Add iOS platform if missing
        run: |
          if [ ! -d "ios/App" ]; then
            npx cap add ios
          else
            echo "iOS platform already exists"
          fi
      
      - name: Sync Capacitor
        run: npx cap sync ios
      
      - name: Verify iOS workspace
        run: |
          echo "Checking generated iOS files..."
          ls -la ios
          ls -la ios/App
          test -d ios/App/App.xcworkspace

      - name: Build iOS Simulator target
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ssm-film-ios-simulator
          path: build/ios/Build/Products/Debug-iphonesimulator/
          if-no-files-found: error
          retention-days: 3
